name: windows-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests (Core)
        run: dotnet test windows/tests/MotionRecord.Core.Tests -c Release
      - name: Publish app (win-x64, self-contained)
        run: dotnet publish windows/src/MotionRecord.App -c Release -r win-x64 --self-contained -o publish
      - name: Add ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName publish\
      - uses: actions/upload-artifact@v4
        with:
          name: MotionRecord-win-x64
          path: publish
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath MotionRecord-win-x64.zip
      - name: Create pre-release with the Windows build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" MotionRecord-win-x64.zip --prerelease --title "MotionRecord ${{ github.ref_name }}" --notes "Pre-release. Windows: распакуйте MotionRecord-win-x64.zip и запустите MotionRecord.exe. macOS: MotionRecord-macOS.zip."
